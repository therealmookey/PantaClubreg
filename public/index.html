<!DOCTYPE html>
<html lang="nl">
<head>

         ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

         SUPABASE CLIENT (EERST LADEN!)

    <!-- ============================================
         CSS
         ============================================ -->
    <link rel="stylesheet" href="../src/assets/css/style.css">

         NAVIGATIE - 100% BREEDTE
         ============================================ -->
    <nav class="navbar">
        <div class="container-full">

                <span>🚲 Panta Club</span>

            <button class="menu-toggle" id="menuToggle" aria-label="Menu openen">

            <ul class="navbar-links" id="navbarLinks">

                <li><a href="#" data-page="fietsen">🚲 Fietsen</a></li>
                <li><a href="#" data-page="klanten">👤 Klanten</a></li>

         ============================================ -->

        <div class="container-full">

         ============================================ -->

    <!-- 2. Dan authenticatie (login/logout functies) -->
    <script src="../src/assets/js/auth.js"></script>
    
    <!-- 3. Dan de hoofdapplicatie (start de app) -->
    <script src="../src/assets/js/app.js"></script>
