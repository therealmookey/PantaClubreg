<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panta Club - Fietsregistratie</title>
    
    <!-- ============================================
         GOOGLE FONTS
         ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- ============================================
         SUPABASE CLIENT (EERST LADEN!)
         ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	
	<!-- QRCode.js library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
	
	<!-- html2canvas voor het exporteren van QR-code als afbeelding -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- XLSX Library voor Excel import -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- ============================================
         CSS
         ============================================ -->
    <link rel="stylesheet" href="../src/assets/css/style.css">
    <link rel="stylesheet" href="../src/assets/css/components.css">
</head>
<body>
    <!-- ============================================
         NAVIGATIE - Wordt geladen via navigation.js
         ============================================ -->
    <div id="navigation"></div>
    
    <!-- ============================================
         MAIN CONTENT - 80% BREEDTE
         ============================================ -->
    <main id="main-content">
        <div class="container" id="content-wrapper">
            <!-- Inhoud wordt hier dynamisch geladen via JavaScript -->
        </div>
    </main>
    
    <!-- ============================================
         FOOTER - Wordt geladen via footer.js
         ============================================ -->
    <div id="footer"></div>
    
    <!-- ============================================
         JAVASCRIPT - LET OP DE VOLGORDE!
         ============================================ -->
    
    <!-- 1. Eerst configuratie (Supabase gegevens) -->
    <script src="../src/assets/js/config.js"></script>
    
    <!-- 2. Dan authenticatie (login/logout functies) -->
    <script src="../src/assets/js/auth.js"></script>
    
    <!-- 3. Dan de componenten (navigatie en footer) -->
    <script src="../src/components/navigation.js"></script>
    <script src="../src/components/footer.js"></script>
    
    <!-- 4. Dan de hoofdapplicatie (start de app) -->
    <script src="../src/assets/js/app.js"></script>
</body>
</html>
