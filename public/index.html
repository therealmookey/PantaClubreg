<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panta Club - Fietsregistratie</title>
    
    <!-- ============================================
         EXTERNE CSS BESTANDEN
         ============================================ -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Eigen CSS (nu in aparte bestanden!) -->
    <link rel="stylesheet" href="../src/assets/css/style.css">
    <link rel="stylesheet" href="../src/assets/css/components.css">
    
    <!-- ============================================
         ALLE JAVASCRIPT BLIJFT IN DE HTML
         (Later verhuizen we dit ook naar aparte bestanden)
         ============================================ -->
</head>
<body>
    <!-- ============================================
         NAVIGATIE
         ============================================ -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <span>🚲 Panta Club</span>
            </div>
            <ul class="navbar-links">
                <li><a href="#" class="active" data-page="dashboard">📊 Dashboard</a></li>
                <li><a href="#" data-page="fietsen">🚲 Fietsen</a></li>
                <li><a href="#" data-page="klanten">👤 Klanten</a></li>
                <li><a href="#" data-page="onderhoud">🔧 Onderhoud</a></li>
                <li><a href="#" id="logout-link">🚪 Uitloggen</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- ============================================
         HOOFD INHOUD
         ============================================ -->
    <main id="main-content">
        <div class="container">
            <!-- Dashboard wordt hier geladen -->
        </div>
    </main>
    
    <!-- ============================================
         FOOTER
         ============================================ -->
    <footer class="site-footer">
        <div class="container">
            <p style="margin-bottom: 5px;">
                &copy; 2026 <strong>Panta Club</strong> 
                - Fietsregistratie Platform
            </p>
            <p style="font-size: 0.85rem; margin: 0;">
                Gebouwd met &#10084; voor een veilige en overzichtelijke fietsadministratie
            </p>
        </div>
    </footer>
    
    <!-- ============================================
         JAVASCRIPT
         ============================================ -->
    <script>
        // ============================================
        // HOOFDAPPLICATIE
        // ============================================
        
        console.log('🚀 Panta Club Fietsregistratie gestart!');
        console.log('📁 CSS wordt nu geladen uit aparte bestanden!');
        
        // ============================================
        // PAGINA'S
        // ============================================
        
        const PAGES = {
            dashboard: `
                <div class="hero">
                    <span class="emoji-big">🚲</span>
                    <h1>Welkom bij Panta Club!</h1>
                    <p class="subtitle">Fietsregistratie Platform - Beheer jouw fietsen, klanten en onderhoud</p>
                    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                        <button class="btn btn-primary" onclick="showMessage('Fietsen pagina komt binnenkort!')">
                            ➕ Fiets toevoegen
                        </button>
                        <button class="btn btn-accent" onclick="showMessage('Klanten pagina komt binnenkort!')">
                            👤 Klant toevoegen
                        </button>
                        <button class="btn btn-primary" onclick="showMessage('Onderhoud pagina komt binnenkort!')">
                            🔧 Onderhoud registreren
                        </button>
                    </div>
                </div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="number">12</div>
                        <div class="label">🚲 Totaal fietsen</div>
                    </div>
                    <div class="stat-item">
                        <div class="number">8</div>
                        <div class="label">👤 Totaal klanten</div>
                    </div>
                    <div class="stat-item">
                        <div class="number">3</div>
                        <div class="label">🔧 Openstaand onderhoud</div>
                    </div>
                    <div class="stat-item">
                        <div class="number">5</div>
                        <div class="label">📋 Verhuurde fietsen</div>
                    </div>
                </div>
                
                <div class="card">
                    <h3 style="margin-bottom: 15px;">📌 Recente activiteit</h3>
                    <ul style="list-style: none; padding: 0;">
                        <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
                            🚲 Fiets #12345 toegevoegd
                            <span style="color: #999; font-size: 0.85rem; float: right;">10 min geleden</span>
                        </li>
                        <li style="padding: 10px 0; border-bottom: 1px solid #eee;">
                            👤 Nieuwe klant: Marie Peeters
                            <span style="color: #999; font-size: 0.85rem; float: right;">1 uur geleden</span>
                        </li>
                        <li style="padding: 10px 0;">
                            🔧 Onderhoud geregistreerd voor fiets #67890
                            <span style="color: #999; font-size: 0.85rem; float: right;">3 uur geleden</span>
                        </li>
                    </ul>
                </div>
            `,
            
            fietsen: `
                <div style="padding: 30px 0;">
                    <h1>🚲 Fietsen</h1>
                    <p style="color: #666; margin-bottom: 20px;">Beheer hier alle fietsen.</p>
                    <button class="btn btn-primary" onclick="showMessage('Nieuwe fiets toevoegen komt binnenkort!')">
                        ➕ Nieuwe fiets toevoegen
                    </button>
                    <div class="card" style="text-align: center; padding: 40px; margin-top: 20px;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">🚲</div>
                        <h3>Geen fietsen gevonden</h3>
                        <p style="color: #999;">Voeg je eerste fiets toe.</p>
                    </div>
                </div>
            `,
            
            klanten: `
                <div style="padding: 30px 0;">
                    <h1>👤 Klanten</h1>
                    <p style="color: #666; margin-bottom: 20px;">Beheer hier alle klanten.</p>
                    <button class="btn btn-primary" onclick="showMessage('Nieuwe klant toevoegen komt binnenkort!')">
                        ➕ Nieuwe klant toevoegen
                    </button>
                    <button class="btn btn-accent" onclick="showMessage('Excel import komt binnenkort!')">
                        📊 Importeer Excel
                    </button>
                    <div class="card" style="text-align: center; padding: 40px; margin-top: 20px;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">👤</div>
                        <h3>Geen klanten gevonden</h3>
                        <p style="color: #999;">Voeg je eerste klant toe.</p>
                    </div>
                </div>
            `,
            
            onderhoud: `
                <div style="padding: 30px 0;">
                    <h1>🔧 Onderhoudsboekje</h1>
                    <p style="color: #666; margin-bottom: 20px;">Registreer onderhoudsbeurten per fiets.</p>
                    <button class="btn btn-primary" onclick="showMessage('Onderhoud registreren komt binnenkort!')">
                        ➕ Nieuw onderhoud registreren
                    </button>
                    <div class="card" style="text-align: center; padding: 40px; margin-top: 20px;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">🔧</div>
                        <h3>Geen onderhoudsbeurten</h3>
                        <p style="color: #999;">Registreer de eerste onderhoudsbeurt.</p>
                    </div>
                </div>
            `
        };
        
        // ============================================
        // FUNCTIES
        // ============================================
        
        function navigateTo(page) {
            console.log('📄 Navigeren naar:', page);
            const content = PAGES[page];
            if (!content) {
                showMessage('Pagina "' + page + '" is nog niet beschikbaar.');
                return;
            }
            
            document.getElementById('main-content').innerHTML = content;
            
            // Update navigatie
            document.querySelectorAll('.navbar-links a').forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === page) {
                    link.classList.add('active');
                }
            });
        }
        
        function showMessage(message) {
            alert('📢 ' + message);
        }
        
        function handleLogout() {
            if (confirm('Weet je zeker dat je wilt uitloggen?')) {
                alert('👋 Je bent uitgelogd!');
                navigateTo('dashboard');
            }
        }
        
        // ============================================
        // START
        // ============================================
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM geladen!');
            console.log('✅ CSS wordt geladen uit: ../src/assets/css/style.css');
            navigateTo('dashboard');
            
            // Logout link
            document.getElementById('logout-link').addEventListener('click', function(e) {
                e.preventDefault();
                handleLogout();
            });
            
            // Navigatie links
            document.querySelectorAll('.navbar-links a[data-page]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    navigateTo(this.getAttribute('data-page'));
                });
            });
        });
    </script>
</body>
</html>
